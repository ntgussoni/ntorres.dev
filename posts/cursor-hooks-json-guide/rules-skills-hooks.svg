<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">Rules vs Skills vs Hooks</text>

  <!-- Rules column -->
  <rect x="40" y="70" width="250" height="300" fill="#f5f5f5" stroke="#cccccc" stroke-width="2" rx="8"/>
  <text x="165" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e85d04">Rules</text>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="14" fill="#333">System prompt injection</text>
  <text x="60" y="168" font-family="Arial, sans-serif" font-size="14" fill="#333">Coding conventions</text>
  <text x="60" y="196" font-family="Arial, sans-serif" font-size="14" fill="#333">Project context</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="14" fill="#666">Shapes intent</text>
  <rect x="80" y="310" width="170" height="36" fill="#ffffff" stroke="#999" rx="4"/>
  <text x="165" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Cannot block</text>

  <!-- Skills column -->
  <rect x="325" y="70" width="250" height="300" fill="#f5f5f5" stroke="#cccccc" stroke-width="2" rx="8"/>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e85d04">Skills</text>
  <text x="345" y="140" font-family="Arial, sans-serif" font-size="14" fill="#333">Reusable instruction packs</text>
  <text x="345" y="168" font-family="Arial, sans-serif" font-size="14" fill="#333">Invoked by name</text>
  <text x="345" y="196" font-family="Arial, sans-serif" font-size="14" fill="#333">Shareable workflows</text>
  <text x="345" y="240" font-family="Arial, sans-serif" font-size="14" fill="#666">Guides behavior</text>
  <rect x="365" y="310" width="170" height="36" fill="#ffffff" stroke="#999" rx="4"/>
  <text x="450" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Cannot block</text>

  <!-- Hooks column -->
  <rect x="610" y="70" width="250" height="300" fill="#fff3e6" stroke="#e85d04" stroke-width="3" rx="8"/>
  <text x="735" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e85d04">Hooks</text>
  <text x="630" y="140" font-family="Arial, sans-serif" font-size="14" fill="#333">Lifecycle interceptors</text>
  <text x="630" y="168" font-family="Arial, sans-serif" font-size="14" fill="#333">Scripts on stdin/stdout</text>
  <text x="630" y="196" font-family="Arial, sans-serif" font-size="14" fill="#333">beforeShellExecution, etc.</text>
  <text x="630" y="240" font-family="Arial, sans-serif" font-size="14" fill="#666">Controls permission</text>
  <rect x="650" y="310" width="170" height="36" fill="#e85d04" rx="4"/>
  <text x="735" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">CAN BLOCK</text>
</svg>
