<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" fill="none">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" fill="#1f2937" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700">The Eval Loop</text>
  <text x="600" y="82" text-anchor="middle" fill="#737373" font-family="Inter, system-ui, sans-serif" font-size="15">Make a change, measure it, compare runs, decide if you improved</text>

  <circle cx="600" cy="290" r="168" fill="none" stroke="#fdba74" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Step 1: Make a change (top) -->
  <rect x="520" y="118" width="160" height="88" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <rect x="548" y="138" width="36" height="28" rx="4" fill="none" stroke="#f97316" stroke-width="2"/>
  <path d="M556 152 h20 M564 144 v16" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <text x="600" y="182" text-anchor="middle" fill="#c2410c" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Make a change</text>

  <!-- Step 2: Run eval (right) -->
  <rect x="820" y="246" width="160" height="88" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="878,272 878,308 906,290" fill="#f97316"/>
  <text x="900" y="310" text-anchor="middle" fill="#c2410c" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Run eval</text>

  <!-- Step 3: Compare (bottom) -->
  <rect x="520" y="374" width="160" height="88" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <rect x="548" y="396" width="44" height="44" rx="6" fill="none" stroke="#f97316" stroke-width="2"/>
  <rect x="600" y="396" width="44" height="44" rx="6" fill="none" stroke="#f97316" stroke-width="2"/>
  <path d="M592 418 h8 M600 410 v16" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <text x="600" y="438" text-anchor="middle" fill="#c2410c" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Compare runs</text>

  <!-- Step 4: Improve (left) -->
  <rect x="220" y="246" width="160" height="88" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <path d="M300 308 v-28 M286 286 l14-14 14 14" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="310" text-anchor="middle" fill="#c2410c" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Improve or revert</text>

  <!-- Arrows on cycle -->
  <path d="M680 160 C760 160 820 190 860 230" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M900 334 C900 360 820 400 680 418" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M520 418 C420 418 340 380 300 334" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M300 246 C300 200 380 160 520 160" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Center ingredients -->
  <circle cx="600" cy="290" r="62" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="600" y="276" text-anchor="middle" fill="#9a3412" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Data</text>
  <text x="600" y="294" text-anchor="middle" fill="#9a3412" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Task</text>
  <text x="600" y="312" text-anchor="middle" fill="#9a3412" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Scorers</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
